<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pitchside live scoring</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ps.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Londrina+Solid:wght@900&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{rootClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--chrome)">

  <div style="height: 50px; flex: none; background: var(--team)"></div>

  <div style="padding: 0 12px; flex: none">
    <div class="card" style="height: 78px; display: flex; align-items: center; gap: 10px; padding: 0 10px">
      <div aria-hidden="true" style="width: 46px; height: 46px; flex: none; background: var(--team); border: 3px solid var(--line); border-radius: {{flagR}}"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 14px; font-weight: 700; line-height: 18px; white-space: nowrap">{{hdr1}}</div>
        <sc-if value="{{notL3}}" hint-placeholder-val="{{ true }}">
          <div class="disp" style="font-size: 26px; white-space: nowrap">{{name}}</div>
        </sc-if>
        <sc-if value="{{isL3}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 8px">
            <button class="btn" onClick="{{togglePick}}" aria-label="Change who throws" style="min-height: 36px; padding: 0 8px; font-size: 24px; text-transform: none; letter-spacing: 0">{{name}}
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <span style="font-size: 14px; font-weight: 600; white-space: nowrap">{{sub}}</span>
          </div>
        </sc-if>
      </div>
      <button class="btn" onClick="{{nextView}}" aria-label="Change view: behind a baseline or from the sideline" style="width: 48px; padding: 0; flex: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2.5" width="8" height="13" rx="1"/><path d="M8 9h8"/><path d="M4 17.5a9 9 0 0 0 16 0"/><path d="m20 21.5v-4h-4"/></svg>
      </button>
    </div>
  </div>

  <div class="mono" style="margin: 10px 12px 0; height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 2px solid var(--line); border-radius: 6px; background: var(--inside); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden">
    <span>{{turnNo}}</span>
    <sc-for list="{{toks}}" as="t" hint-placeholder-count="2"><span>{{t.t}}</span></sc-for>
    <span style="flex: 1"></span>
    <sc-for list="{{pips}}" as="b" hint-placeholder-count="6"><span aria-hidden="true" style="width: 10px; height: 22px; flex: none; border: 2px solid var(--line); border-radius: 5px; background: var(--kubb); box-shadow: {{b.sh}}"></span></sc-for>
    <span style="font-family: Inter, system-ui, sans-serif; font-size: 14px">{{pipLabel}}</span>
  </div>

  <div style="position: relative; height: 460px; margin-top: 6px; flex: none; background: var(--rough); overflow: hidden">
    <button onClick="{{tap}}" aria-label="The pitch. Tap a kubb or a spot." style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; cursor: crosshair"></button>

    <div style="position: absolute; left: {{g.l}}px; top: {{g.t}}px; width: {{g.w}}px; height: {{g.h}}px; background: var(--grass); outline: 3px solid var(--chalk); pointer-events: none">
      <sc-if value="{{zone.show}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: {{zone.l}}%; top: {{zone.t}}%; width: {{zone.w}}%; height: {{zone.h}}%; background: rgba(251,246,234,0.2); border: 3px dashed var(--chalk)"></div>
      </sc-if>
      <div style="position: absolute; left: {{cl.l}}; top: {{cl.t}}; width: {{cl.w}}; height: {{cl.h}}; background: var(--chalk)"></div>
      <sc-if value="{{adv.show}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: {{adv.l}}; top: {{adv.t}}; width: {{adv.w}}; height: {{adv.h}}; border-top: 4px dashed var(--chalk); border-left: 4px dashed var(--chalk)"></div>
        <div class="chip" style="position: absolute; left: {{adv.cl}}; top: {{adv.ct}}; transform: {{adv.ctf}}; white-space: nowrap; background: var(--plate)">Advantage line</div>
      </sc-if>
      <sc-for list="{{stakes}}" as="s" hint-placeholder-count="6">
        <div style="position: absolute; left: {{s.l}}%; top: {{s.t}}%; width: 10px; height: 10px; transform: translate(-50%,-50%); background: var(--kubb); border: 2px solid #16130f; border-radius: 2px"></div>
      </sc-for>
      <sc-for list="{{rings}}" as="r" hint-placeholder-count="0">
        <div style="position: absolute; left: {{r.l}}%; top: {{r.t}}%; width: 42px; height: 42px; transform: translate(-50%,-50%); border: 2px dotted var(--chalk); border-radius: 50%"></div>
      </sc-for>
      <sc-for list="{{ghosts}}" as="h" hint-placeholder-count="0">
        <div style="position: absolute; left: {{h.l}}%; top: {{h.t}}%; width: 30px; height: 30px; transform: translate(-50%,-50%); border: 3px dotted var(--chalk); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--chalk); font-weight: 800; font-size: 14px">{{h.n}}</div>
      </sc-for>
      <div style="position: absolute; left: 50%; top: 50%; width: {{king.s}}px; height: {{king.s}}px; transform: translate(-50%,-50%) rotate({{king.rot}}deg); background: {{king.bg}}; border: 3px solid #16130f; border-radius: 4px; box-shadow: {{king.sh}}; display: flex; align-items: center; justify-content: center; color: #16130f" class="disp" aria-hidden="true"><span style="font-size: 18px">K</span></div>
      <sc-for list="{{kubbs}}" as="k" hint-placeholder-count="7">
        <button onClick="{{k.pick}}" aria-label="{{k.aria}}" style="position: absolute; left: {{k.l}}%; top: {{k.t}}%; width: {{k.w}}px; height: {{k.h}}px; transform: translate(-50%,-50%) rotate({{k.rot}}deg); padding: 0; background: {{k.bg}}; border: {{k.bd}}; border-radius: {{k.r}}; box-shadow: {{k.sh}}; color: {{k.ink}}; font-weight: 800; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; pointer-events: none">{{k.mark}}</button>
      </sc-for>
      <sc-for list="{{pins}}" as="p" hint-placeholder-count="0">
        <div style="position: absolute; left: {{p.l}}%; top: {{p.t}}%; width: 30px; height: 26px; transform: translate(-50%,-50%); background: #f7f0de; border: 2px solid #16130f; border-radius: 4px; box-shadow: 2px 2px 0 #16130f; display: flex; align-items: center; justify-content: center; color: #16130f">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" role="img" aria-label="Photo pinned here"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </div>
      </sc-for>
      <sc-if value="{{stance.show}}">
        <div role="img" aria-label="Where the baton is thrown from" style="position: absolute; left: {{stance.l}}%; top: {{stance.t}}%; width: 30px; height: 30px; transform: translate(-50%,-50%); border: 3px solid #16130f; border-radius: 50%; background: #fbf6ea; box-shadow: 2px 2px 0 #16130f; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16130f" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 6v8M16 10v8"/></svg>
        </div>
      </sc-if>
    </div>

    <div class="chip" style="position: absolute; left: {{chipA.l}}; top: {{chipA.t}}; transform: {{chipA.tf}}; height: 22px; display: flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--plate); pointer-events: none">
      <span aria-hidden="true" style="width: 12px; height: 12px; border: 2px solid var(--line); border-radius: 2px; background: #f2b705"></span>{{chipA.text}}
    </div>
    <div class="chip" style="position: absolute; left: {{chipB.l}}; top: {{chipB.t}}; transform: {{chipB.tf}}; height: 22px; display: flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--plate); pointer-events: none">
      <span aria-hidden="true" style="width: 12px; height: 12px; border: 2px solid var(--line); border-radius: 2px; background: #8e44ad"></span>{{chipB.text}}
    </div>
  </div>

  <div style="height: 70px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--ground); border-top: 3px solid var(--line); border-bottom: 3px solid var(--line)">
    <sc-if value="{{showPrompt}}" hint-placeholder-val="{{ true }}">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <div class="kick" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{kick}}</div>
        <div style="font-size: 16px; font-weight: 600; line-height: 20px">{{text}}</div>
      </div>
      <sc-if value="{{showPlace}}" hint-placeholder-val="{{ false }}">
        <button class="btn" onClick="{{startPlacing}}" style="flex: none; padding: 0 10px; font-size: 18px">{{placeLabel}}</button>
      </sc-if>
      <button class="btn" onClick="{{openCam}}" aria-label="Take a photo" style="width: 48px; padding: 0; flex: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
    </sc-if>
    <sc-if value="{{ui.pick}}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <div class="kick">{{pickKick}}</div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{players}}" as="p" hint-placeholder-count="3">
            <button class="{{p.cls}}" onClick="{{p.pick}}" style="flex: 1; min-height: 44px; padding: 0 4px; text-transform: none; letter-spacing: 0">{{p.name}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="flex: 1; display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px 0; border-top: 0 solid var(--team)">
    <button class="btn" onClick="{{undo}}" style="width: 92px; height: 64px; padding: 0; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 4 10l5 5"/><path d="M4 10h10a5 5 0 0 1 0 10h-3"/></svg>Undo
    </button>
    <sc-if value="{{bar.showP}}" hint-placeholder-val="{{ true }}">
      <button class="{{bar.pCls}}" onClick="{{primary}}" style="flex: 1; height: 64px; padding: 0 6px; font-size: {{bar.pSize}}px">{{bar.p}}</button>
    </sc-if>
    <sc-if value="{{bar.showS}}" hint-placeholder-val="{{ false }}">
      <button class="btn" onClick="{{second}}" style="flex: none; height: 64px; padding: 0 10px; min-width: 76px">{{bar.s}}</button>
    </sc-if>
    <sc-if value="{{bar.showOver}}" hint-placeholder-val="{{ false }}">
      <a class="btn solid" href="Sheet.dc.html" style="flex: 1; height: 64px">Score sheet</a>
    </sc-if>
    <button class="btn" onClick="{{toggleMore}}" aria-label="Rare events: illegal throw, early king, resign" style="width: 52px; height: 64px; padding: 0; flex: none; letter-spacing: 2px">•••</button>
  </div>

  <sc-if value="{{ui.more}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 136px; padding: 10px 12px 14px; background: var(--ground); border-top: 3px solid var(--line); border-bottom: 3px solid var(--line); display: flex; flex-direction: column; gap: 8px">
      <div class="kick">Rare events</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button class="btn" onClick="{{illegal}}" style="font-size: 18px; padding: 0 4px">Illegal throw</button>
        <button class="btn" onClick="{{knockedOut}}" style="font-size: 18px; padding: 0 4px">Kubb knocked out</button>
        <button class="btn" onClick="{{earlyKing}}" style="font-size: 18px; padding: 0 4px; border-color: var(--warn)">King hit early</button>
        <button class="quiet" onClick="{{resign}}" style="justify-content: center">{{resignLabel}}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{camOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 136px; padding: 10px 12px; background: var(--ground); border-top: 3px solid var(--line); border-bottom: 3px solid var(--line); display: flex; gap: 12px; align-items: stretch">
      <div style="width: 132px; height: 100px; flex: none; border: 3px solid var(--line); border-radius: 6px; background: repeating-linear-gradient(45deg, var(--inside) 0 8px, var(--wood) 8px 16px); display: flex; align-items: center; justify-content: center"><span class="chip">Camera view</span></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between">
        <div class="kick">{{camKick}}</div>
        <div style="display: flex; gap: 8px; align-items: center">
          <button class="btn solid" onClick="{{snap}}" style="flex: 1; height: 56px">Snap</button>
          <button class="quiet" onClick="{{closeCam}}">Close</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"enum","options":["1","2","3"],"default":"2","section":"Capture"},"who":{"editor":"boolean","default":false,"section":"Capture"},"stance":{"editor":"boolean","default":false,"section":"Capture"},"scene":{"editor":"enum","options":["stance","start","place","rethrow","pun","three","batons","thrower","king","rare","turn","catchup","undo","photo"],"default":"start","section":"Moment"},"view":{"editor":"enum","options":["A","side","B"],"default":"A","section":"View"},"dark":{"editor":"boolean","default":false,"section":"View"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  teams() {
    return {
      A: { name: 'Wobbly Towers', players: ['Kim', 'Dana', 'Ole'] },
      B: { name: 'Birch Batons', players: ['Priya', 'Sam', 'Lee'] }
    };
  }
  scenes() {
    const IN3 = [['p', 1.8, 5.2], ['p', 2.5, 5.35], ['p', 2.15, 5.85]];
    const MARK3 = [['k', 'f1'], ['k', 'f2'], ['k', 'f3']];
    const B1 = IN3.concat(MARK3, [['go']]);
    const BASES = [['k', 'B0'], ['go'], ['k', 'B2'], ['go'], ['k', 'B3'], ['go']];
    const KING = B1.concat(BASES);
    return {
      start: [],
      place: [IN3[0]],
      rethrow: [IN3[0], IN3[1], ['out']],
      pun: [IN3[0], IN3[1], ['out'], ['out']],
      three: IN3.concat(MARK3),
      batons: B1,
      thrower: B1.concat([['k', 'B0'], ['go'], ['ui', 'pick', true]]),
      king: KING,
      rare: KING.concat([['ui', 'more', true]]),
      turn: KING.concat([['km'], ['km']]),
      catchup: [['later']].concat(MARK3, [['go']], BASES, [['km'], ['km'], ['ui', 'placing', true], ['p', 1.8, 5.2]]),
      undo: B1.concat([['k', 'B0'], ['go'], ['undo']]),
      photo: B1.concat([['snap'], ['p', 1.1, 6.7], ['ui', 'cam', 'open']]),
      stance: B1.concat([['p', 3.9, 2.6], ['k', 'B0']])
    };
  }
  boot() {
    const p = this.props;
    const base = (side, i) => ({ id: side + i, side: side, kind: 'base', x: i + 0.5, y: side === 'A' ? 0 : 8, st: 'up' });
    const on = (q) => q === true || q === '1' || q === 'true';
    this.level = parseInt(String(p.level || '2'), 10) || 2;
    this.whoOn = this.level >= 3 || on(p.who);
    this.stanceOn = on(p.stance);
    this.ui = { more: false, cam: null, pick: false, placing: false, view: p.view || 'A' };
    this.hist = [];
    this.S = {
      turn: 5, team: 'A', phase: 'inkast', stage: 'throw', hand: 3, n0: 3, re: 0, pn: 0, nr: 0, np: 0,
      baton: 1, batons: 6, tokens: [], pending: [], st: null, stances: [], nid: 1, flash: '', owed: [], pins: [], over: null, who: null,
      kubbs: [base('A', 0), base('A', 2), base('A', 4), base('B', 0), base('B', 2), base('B', 3),
        { id: 'a1', side: 'A', kind: 'field', x: 3.4, y: 2.7, st: 'up', approx: true }]
    };
    const ops = this.scenes()[p.scene || 'start'] || [];
    const lv = this.level;
    this.level = Math.max(lv, 2);
    ops.forEach((o) => {
      if (o[0] === 'p') this.spot(o[1], o[2]);
      else if (o[0] === 'k') this.tapKubb(o[1]);
      else if (o[0] === 'go') this.primary();
      else if (o[0] === 'out') this.out();
      else if (o[0] === 'later') this.later();
      else if (o[0] === 'km') this.km();
      else if (o[0] === 'undo') this.undo();
      else if (o[0] === 'snap') this.snap();
      else if (o[0] === 'ui') this.ui[o[1]] = o[2];
    });
    this.level = lv;
  }
  opp() { return this.S.team === 'A' ? 'B' : 'A'; }
  save(label) {
    this.hist.push({ s: JSON.stringify(this.S), label: label });
    this.S.flash = '';
    this.ui.more = false; this.ui.pick = false; this.ui.cam = null;
  }
  undo() {
    const h = this.hist.pop();
    this.ui.more = false; this.ui.pick = false; this.ui.cam = null;
    if (!h) { this.S.flash = 'Nothing to undo'; return; }
    this.S = JSON.parse(h.s);
    this.S.flash = 'Undone: ' + h.label;
    if (!this.S.owed.some((q) => !q.done)) this.ui.placing = false;
  }
  addField(x, y, flags) {
    const S = this.S; const id = 'f' + (S.nid++);
    S.kubbs.push(Object.assign({ id: id, side: this.opp(), kind: 'field', x: x, y: y, st: 'up' }, flags));
    return id;
  }
  afterInkast() {
    const S = this.S;
    if (S.hand > 0) return;
    if (S.re > 0) { S.stage = 'rethrow'; return; }
    if (S.pn > 0) {
      if (this.level >= 2) { S.stage = 'pun'; return; }
      while (S.pn > 0) { this.addField(null, null, { pun: true }); S.pn--; }
    }
    const c = (n, x) => (n ? (n > 1 ? n : '') + x : '');
    S.tokens = [S.n0 + 'I' + c(S.nr, 'R') + c(S.np, 'P')];
    S.stage = ''; S.phase = 'batons';
    this.checkEnd();
  }
  place(x, y) {
    const S = this.S;
    if (S.stage === 'throw') { this.save('kubb thrown in'); this.addField(x, y, { approx: true }); S.hand--; }
    else if (S.stage === 'rethrow') { this.save('rethrow in'); this.addField(x, y, { approx: true }); S.re--; }
    else { this.save('punishment kubb'); this.addField(x, y, { approx: true, pun: true }); S.pn--; }
    this.afterInkast();
  }
  out() {
    const S = this.S;
    if (S.stage === 'throw') { this.save('kubb out'); S.hand--; S.re++; S.nr++; }
    else if (S.stage === 'rethrow') { this.save('out twice'); S.re--; S.pn++; S.np++; }
    else return;
    this.afterInkast();
  }
  allIn() {
    const S = this.S; this.save('kubbs in');
    if (S.stage === 'throw') { while (S.hand > 0) { this.addField(null, null, {}); S.hand--; } }
    else if (S.stage === 'rethrow') { this.addField(null, null, {}); S.re--; }
    this.afterInkast();
  }
  later() {
    const S = this.S; this.save('positions later');
    const pun = S.stage === 'pun';
    const key = S.stage === 'throw' ? 'hand' : (S.stage === 'rethrow' ? 're' : 'pn');
    while (S[key] > 0) {
      const id = this.addField(null, null, { owedPos: true, pun: pun });
      S.owed.push({ id: id, turn: S.turn, side: this.opp(), done: false });
      S[key]--;
    }
    this.afterInkast();
  }
  baseOpen() {
    const S = this.S, o = this.opp();
    return !S.kubbs.some((k) => k.side === o && k.kind === 'field' && k.st === 'up' && S.pending.indexOf(k.id) < 0);
  }
  tapKubb(id) {
    const S = this.S; const k = S.kubbs.find((q) => q.id === id);
    if (!k || k.side !== this.opp() || k.st !== 'up' || S.phase !== 'batons') return;
    const i = S.pending.indexOf(id);
    if (i < 0 && k.kind === 'base' && !this.baseOpen()) { S.flash = 'Field kubbs first'; return; }
    this.save(i < 0 ? 'kubb marked' : 'kubb unmarked');
    if (i >= 0) S.pending.splice(i, 1); else S.pending.push(id);
    if (!this.baseOpen()) S.pending = S.pending.filter((pid) => S.kubbs.find((q) => q.id === pid).kind === 'field');
  }
  checkEnd() {
    const S = this.S, o = this.opp();
    if (S.baton > S.batons) { this.endTurn(); return; }
    S.phase = S.kubbs.some((k) => k.side === o && k.st === 'up') ? 'batons' : 'king';
  }
  go() {
    const S = this.S;
    const ids = S.pending.slice();
    const f = ids.filter((id) => S.kubbs.find((k) => k.id === id).kind === 'field').length, b = ids.length - f;
    const c = (n, x) => (n ? (n > 1 ? n : '') + x : '');
    const tok = ids.length ? c(f, 'F') + c(b, 'B') : '-';
    this.save('baton ' + S.baton + ' · ' + (ids.length ? tok : 'miss'));
    this.S.kubbs.forEach((k) => { if (ids.indexOf(k.id) >= 0) k.st = 'down'; });
    this.mark(); S.pending = []; S.tokens.push(tok); S.baton++; S.who = null;
    this.checkEnd();
  }
  kd() { const S = this.S; this.save('king down'); this.mark(); S.tokens.push('K'); S.phase = 'over'; S.over = S.team; }
  km() { const S = this.S; this.save('king shot · miss'); this.mark(); S.tokens.push('-'); S.baton++; S.who = null; this.checkEnd(); }
  word(q) {
    if (!q) return '-';
    const d = this.S.team === 'A' ? 4 - q.y : q.y - 4;
    return q.x.toFixed(2) + ',' + d.toFixed(2);
  }
  mark() { if (this.stanceOn) this.S.stances.push(this.word(this.S.st)); }
  stand(x, y) {
    const S = this.S, A = S.team === 'A';
    const own = S.kubbs.filter((k) => k.side === S.team && k.kind === 'field' && k.st === 'up' && k.x != null);
    const base = A ? 0 : 8;
    const lines = [base];
    if (own.length && S.phase === 'batons') lines.push(A ? Math.max.apply(null, own.map((k) => k.y)) : Math.min.apply(null, own.map((k) => k.y)));
    let yy = Math.max(-0.4, Math.min(8.4, y));
    lines.forEach((l) => { if (Math.abs(yy - l) < 0.35) yy = l; });
    this.save('thrown from');
    S.st = { x: Math.max(0, Math.min(5, x)), y: yy };
  }
  endTurn() {
    const S = this.S, o = this.opp();
    const down = S.kubbs.filter((k) => k.side === o && k.st === 'down').length;
    const hits = S.tokens.slice(1).filter((t) => t !== '-').length;
    S.kubbs = S.kubbs.filter((k) => !(k.side === o && k.st === 'down'));
    S.flash = 'Turn ' + S.turn + ' done · ' + down + ' down with ' + hits + ' of ' + S.batons + ' batons';
    S.turn++; S.team = o; S.phase = 'inkast'; S.stage = 'throw'; S.hand = down; S.n0 = down;
    S.re = 0; S.pn = 0; S.nr = 0; S.np = 0; S.baton = 1; S.batons = 6; S.tokens = []; S.pending = []; S.who = null; S.st = null; S.stances = [];
    if (down === 0) { S.tokens = ['0I']; S.stage = ''; S.phase = 'batons'; }
  }
  snap() { this.save('photo'); this.ui.cam = 'pin'; }
  primary() {
    const S = this.S, ui = this.ui;
    if (ui.placing) { ui.placing = false; return; }
    if (S.phase === 'inkast') {
      if (this.level < 2) this.allIn();
      else if (S.stage === 'pun') this.later();
      else this.out();
    } else if (S.phase === 'batons') this.go();
    else if (S.phase === 'king') this.kd();
  }
  second() {
    const S = this.S;
    if (S.phase === 'inkast') { if (this.level < 2) this.out(); else this.later(); }
    else if (S.phase === 'king') this.km();
  }
  rare(kind) {
    const S = this.S;
    if (S.phase === 'over') return;
    if (kind === 'illegal') {
      if (S.phase === 'inkast') { this.ui.more = false; S.flash = 'Illegal throws are for batons'; return; }
      this.save('illegal throw'); S.tokens.push('-'); S.baton++; S.who = null; S.pending = []; this.checkEnd();
      if (!S.flash) S.flash = 'Illegal throw · counted as a miss';
    } else if (kind === 'out') { this.save('kubb knocked out'); S.flash = 'Noted · kubb knocked out of bounds'; }
    else if (kind === 'king') { this.save('king hit early'); S.phase = 'over'; S.over = this.opp(); S.flash = 'King hit early'; }
    else { this.save('resignation'); S.phase = 'over'; S.over = this.opp(); S.flash = this.teams()[S.team].name + ' resign'; }
  }
  pos(k) {
    if (k.x != null) return [k.x, k.y];
    const row = this.S.kubbs.filter((q) => q.side === k.side && q.x == null);
    return [2.5 + (row.indexOf(k) - (row.length - 1) / 2) * 0.75, k.side === 'B' ? 6.2 : 1.8];
  }
  geo() { return this.ui.view === 'side' ? { l: 19, t: 120, w: 352, h: 220 } : { l: 65, t: 22, w: 260, h: 416 }; }
  spot(x, y) {
    const S = this.S, ui = this.ui;
    const inside = x >= 0 && x <= 5 && y >= 0 && y <= 8;
    ui.more = false; ui.pick = false;
    if (ui.cam === 'pin') {
      if (inside) { this.save('photo pin'); S.pins.push({ x: x, y: y }); }
      ui.cam = null; return;
    }
    if (ui.cam === 'open') { ui.cam = null; return; }
    if (ui.placing) {
      const o = S.owed.find((q) => !q.done);
      if (o && inside && ((o.side === 'B') === (y > 4))) {
        this.save('position');
        o.done = true; o.x = x; o.y = y;
        const k = S.kubbs.find((q) => q.id === o.id);
        if (k) { k.x = x; k.y = y; k.owedPos = false; k.approx = true; }
        if (!S.owed.some((q) => !q.done)) ui.placing = false;
      }
      return;
    }
    if (S.phase === 'inkast') {
      if (this.level < 2) { S.flash = 'At this level, use the buttons below'; return; }
      const inTarget = inside && ((this.opp() === 'B') === (y > 4));
      if (inTarget) this.place(x, y); else this.out();
      return;
    }
    const mine = (S.team === 'A') === (y < 4);
    if (S.phase === 'batons') {
      if (this.stanceOn && mine) { this.stand(x, y); return; }
      const o = this.opp(); let best = null, bd = 0.62;
      S.kubbs.forEach((k) => {
        if (k.side !== o || k.st !== 'up') return;
        const q = this.pos(k); const d = Math.hypot(q[0] - x, q[1] - y);
        if (d < bd) { bd = d; best = k; }
      });
      if (best) this.tapKubb(best.id);
      return;
    }
    if (S.phase === 'king' && Math.hypot(x - 2.5, y - 4) < 0.7) this.kd();
    else if (S.phase === 'king' && this.stanceOn && mine) this.stand(x, y);
  }
  onTap(e) {
    const r = e.currentTarget.getBoundingClientRect(); const sc = r.width / 390;
    const g = this.geo(), v = this.ui.view;
    const u = ((e.clientX - r.left) / sc - g.l) / g.w, w = ((e.clientY - r.top) / sc - g.t) / g.h;
    if (v === 'A') this.spot(u * 5, (1 - w) * 8);
    else if (v === 'B') this.spot((1 - u) * 5, w * 8);
    else this.spot(w * 5, u * 8);
  }
  renderVals() {
    const p = this.props;
    const key = [p.scene, p.level, p.view, p.dark, p.who, p.stance].join('|');
    if (key !== this.key) { this.key = key; this.boot(); }
    const S = this.S, ui = this.ui, L = this.level, TS = this.teams(), T = TS[S.team], o = this.opp(), OT = TS[o];
    const dark = p.dark === true || p.dark === '1' || p.dark === 'true';
    const act = (fn) => () => { fn(); this.forceUpdate(); };
    const n = (c, w) => c + ' ' + w + (c === 1 ? '' : 's');
    const v = ui.view, side = v === 'side';
    const scr = (x, y) => (v === 'A' ? [x / 5 * 100, (8 - y) / 8 * 100] : v === 'B' ? [(5 - x) / 5 * 100, y / 8 * 100] : [y / 8 * 100, x / 5 * 100]);
    const INK = '#16130f';

    const open = this.baseOpen();
    const kubbs = S.kubbs.map((k) => {
      const q = this.pos(k), s = scr(q[0], q[1]);
      const pend = S.pending.indexOf(k.id) >= 0;
      const target = S.phase === 'batons' && k.side === o && k.st === 'up' && (k.kind === 'field' || open);
      const r = '4px';
      const dash = k.x == null ? 'dashed' : 'solid';
      const it = { l: s[0], t: s[1], w: 20, h: 20, rot: 0, r: r, bg: 'var(--kubb-rest)', bd: '2px ' + dash + ' ' + INK, sh: 'none', ink: INK,
        mark: k.owedPos ? '?' : (k.pun ? 'P' : ''), pick: act(() => this.tapKubb(k.id)),
        aria: (k.kind === 'base' ? 'Base kubb' : 'Field kubb') + (k.st === 'down' ? ', down' : pend ? ', marked as down' : ', standing') };
      if (k.st === 'down') { it.w = 28; it.h = 13; it.rot = side ? 62 : 28; it.r = '3px'; it.mark = ''; }
      else if (pend) { it.w = 30; it.h = 30; it.bg = INK; it.bd = '3px solid #fbf6ea'; it.sh = '0 0 0 3px ' + INK; it.ink = '#fbf6ea'; it.mark = '✓'; }
      else if (target) { it.w = 26; it.h = 26; it.bg = 'var(--kubb)'; it.bd = '3px ' + dash + ' ' + INK; it.sh = '3px 3px 0 ' + INK; }
      return it;
    });
    const rings = S.kubbs.filter((k) => k.approx && k.st === 'up' && k.x != null).map((k) => { const s = scr(k.x, k.y); return { l: s[0], t: s[1] }; });
    const ghosts = [];
    if (ui.placing) S.owed.forEach((q, i) => { if (q.done && !S.kubbs.some((k) => k.id === q.id)) { const s = scr(q.x, q.y); ghosts.push({ l: s[0], t: s[1], n: i + 1 }); } });
    const pins = S.pins.map((q) => { const s = scr(q.x, q.y); return { l: s[0], t: s[1] }; });
    const stakes = [[0, 0], [5, 0], [0, 4], [5, 4], [0, 8], [5, 8]].map((q) => { const s = scr(q[0], q[1]); return { l: s[0], t: s[1] }; });

    const kingT = S.phase === 'king';
    const kingDown = S.phase === 'over' && S.tokens[S.tokens.length - 1] === 'K';
    const king = { s: kingT ? 34 : 30, rot: kingDown ? 40 : 0, bg: kingDown ? 'var(--kubb-rest)' : 'var(--kubb)',
      sh: kingT ? '0 0 0 4px #fbf6ea, 4px 4px 0 4px ' + INK : 'none' };

    const cl = side ? { l: 'calc(50% - 1px)', t: '0', w: '3px', h: '100%' } : { l: '0', t: 'calc(50% - 1px)', w: '100%', h: '3px' };

    const own = S.kubbs.filter((k) => k.side === S.team && k.kind === 'field' && k.st === 'up' && k.x != null);
    let adv = { show: false };
    if (S.phase === 'batons' && own.length) {
      const ay = S.team === 'A' ? Math.max.apply(null, own.map((k) => k.y)) : Math.min.apply(null, own.map((k) => k.y));
      const s = scr(0, ay);
      adv = side
        ? { show: true, l: s[0] + '%', t: '0', w: '0', h: '100%', cl: s[0] + '%', ct: '100%', ctf: 'translate(-50%, 6px)' }
        : { show: true, l: '0', t: s[1] + '%', w: '100%', h: '0', cl: '4px', ct: s[1] + '%', ctf: 'translate(0, 6px)' };
    }
    const hasAdv = adv.show;

    let zone = { show: false };
    const zoneSide = ui.placing ? (S.owed.find((q) => !q.done) || {}).side : (S.phase === 'inkast' && L >= 2 ? o : null);
    if (zoneSide) {
      const far = zoneSide === 'B';
      if (side) zone = { show: true, l: far ? 50 : 0, t: 0, w: 50, h: 100 };
      else { const top = (v === 'A') === far; zone = { show: true, l: 0, t: top ? 0 : 50, w: 100, h: 50 }; }
    }

    const up = (sd) => S.kubbs.filter((k) => k.side === sd && k.st === 'up').length;
    const chip = (sd) => {
      const text = TS[sd].name + ' · ' + up(sd) + ' standing';
      if (side) return sd === 'A' ? { l: '19px', t: '92px', tf: 'none', text: text } : { l: '371px', t: '92px', tf: 'translate(-100%, 0)', text: text };
      const bottom = (v === 'A') === (sd === 'A');
      return { l: '195px', t: bottom ? '438px' : '0px', tf: 'translate(-50%, 0)', text: text };
    };

    const who = S.who || T.players[S.phase === 'inkast' ? 0 : (S.baton - 1) % T.players.length];
    const isL3 = this.whoOn && S.phase !== 'over';
    let hdr1 = 'Turn ' + S.turn + ' · ';
    if (S.phase === 'inkast') hdr1 += 'inkast · ' + (S.hand + S.re + S.pn) + ' to throw';
    else if (S.phase === 'batons') hdr1 += 'baton ' + S.baton + ' of ' + S.batons;
    else if (S.phase === 'king') hdr1 += 'baton ' + S.baton + ' of ' + S.batons + ' · king';
    else hdr1 += 'game over';

    const left = S.phase === 'inkast' ? S.batons : (S.phase === 'over' ? 0 : S.batons - S.baton + 1);
    const pips = []; for (let i = 0; i < left; i++) pips.push({ sh: i === 0 && S.phase !== 'inkast' ? '2px 2px 0 var(--shade)' : 'none' });

    let kick = '', text = '';
    const pc = S.pending.length;
    if (ui.placing) {
      const tot = S.owed.length, lf = S.owed.filter((q) => !q.done).length, cur = S.owed.find((q) => !q.done);
      kick = 'Catch-up · turn ' + (cur ? cur.turn : S.turn) + ' inkast · ' + lf + ' owed';
      text = 'Tap where kubb ' + (tot - lf + 1) + ' of ' + tot + ' landed. By eye is fine.';
    } else if (ui.cam === 'pin') {
      kick = 'Photo saved to ' + (S.phase === 'inkast' ? 'the inkast' : 'baton ' + S.baton);
      text = 'Tap the pitch to pin it to a spot, or just carry on.';
    } else if (S.phase === 'inkast') {
      if (L < 2) {
        if (S.stage === 'throw') { kick = S.nr ? n(S.hand, 'kubb') + ' to land · ' + S.nr + ' out' : n(S.hand, 'kubb') + ' to throw in'; text = S.nr ? 'Tap when the rest are in, or 1 OUT again.' : 'All in the far half? Tap ALL IN. One landed out? Tap 1 OUT.'; }
        else { kick = 'Rethrow · ' + n(S.re, 'kubb'); text = 'A kubb that lands out gets one more throw. In, or out again?'; }
      } else if (S.stage === 'throw') {
        kick = n(S.hand, 'kubb') + ' to throw in';
        text = S.hand === S.n0 ? 'Tap where each kubb lands in the marked half.' : 'Tap where the next one lands.';
      } else if (S.stage === 'rethrow') { kick = 'Rethrow · ' + n(S.re, 'kubb') + ' landed out'; text = 'It is thrown again. Tap where it lands.'; }
      else { kick = 'Punishment kubb · out twice'; text = OT.name + ' place it. Tap where they put it.'; }
    } else if (S.phase === 'batons') {
      kick = 'Baton ' + S.baton + ' of ' + S.batons + (hasAdv ? ' · from the advantage line' : '');
      text = pc ? n(pc, 'kubb') + ' marked. Tap ' + pc + ' DOWN when that is all of them.' : (open ? 'Tap each kubb this baton knocked over.' : 'Tap each kubb this baton knocked over. Field kubbs first.');
    } else if (S.phase === 'king') {
      kick = 'King shot · baton ' + S.baton + ' of ' + S.batons;
      text = 'Every kubb is down. This baton is at the king, from the baseline.';
    } else { kick = 'Game over · turn ' + S.turn; text = TS[S.over].name + ' win.'; }
    const throwing = S.phase === 'batons' || S.phase === 'king';
    let stance = { show: false };
    if (this.stanceOn && throwing) {
      if (S.st) { const s = scr(S.st.x, S.st.y); stance = { show: true, l: s[0], t: s[1] }; kick += ' · from ' + this.word(S.st); }
      else if (!pc && !ui.placing && ui.cam !== 'pin') text = 'Tap where the thrower stands, on your side. Then tap what fell.';
    }
    if (S.flash && !ui.placing) kick = S.flash;

    const bar = { showP: true, showS: false, showOver: false, p: '', s: '', pCls: 'btn solid', pSize: 26 };
    if (ui.placing) { bar.p = 'Back to scoring'; bar.pCls = 'btn'; bar.pSize = 22; }
    else if (S.phase === 'inkast') {
      bar.showS = true;
      if (L < 2) {
        if (S.stage === 'throw') { bar.p = (S.nr ? '' : 'All ') + S.hand + ' in'; bar.s = '1 out'; }
        else { bar.p = 'In'; bar.s = 'Out again'; }
      } else {
        bar.pCls = 'btn'; bar.pSize = 22; bar.s = 'Later';
        if (S.stage === 'throw') bar.p = 'Out';
        else if (S.stage === 'rethrow') bar.p = 'Out again';
        else { bar.p = 'Place it later'; bar.showS = false; }
      }
    } else if (S.phase === 'batons') { bar.p = pc ? pc + ' down' : 'Miss'; bar.pSize = 30; }
    else if (S.phase === 'king') { bar.p = 'King down'; bar.s = 'Miss'; bar.showS = true; }
    else { bar.showP = false; bar.showOver = true; }

    const owedN = S.owed.filter((q) => !q.done).length;
    const players = T.players.map((nm) => ({ name: nm, cls: nm === who ? 'btn solid' : 'btn', pick: act(() => { this.save('thrower'); this.S.who = nm; }) }));
    const where = S.phase === 'inkast' ? 'the inkast' : 'baton ' + S.baton;

    return {
      rootClass: 'ps t' + S.team + (dark ? ' dark' : ''),
      flagR: '6px',
      hdr1: hdr1, name: isL3 ? who : (S.phase === 'over' ? TS[S.over].name : T.name), sub: T.name, isL3: isL3, notL3: !isL3,
      turnNo: S.turn + '.', toks: S.tokens.map((t) => ({ t: t })), pips: pips, pipLabel: S.phase === 'over' ? '' : left + ' left',
      g: this.geo(), zone: zone, cl: cl, adv: adv, stakes: stakes, rings: rings, ghosts: ghosts, king: king, kubbs: kubbs, pins: pins, stance: stance,
      chipA: chip('A'), chipB: chip('B'),
      ui: ui, showPrompt: !ui.pick, kick: kick, text: text,
      showPlace: owedN > 0 && !ui.placing, placeLabel: 'Place ' + owedN,
      pickKick: S.phase === 'inkast' ? 'Who throws the kubbs in?' : 'Who throws baton ' + S.baton + '?', players: players,
      bar: bar, camOpen: ui.cam === 'open', camKick: 'Photo for ' + where, resignLabel: T.name + ' resign',
      tap: (e) => { this.onTap(e); this.forceUpdate(); },
      undo: act(() => this.undo()),
      primary: act(() => this.primary()),
      second: act(() => this.second()),
      nextView: act(() => { ui.view = v === 'A' ? 'side' : (v === 'side' ? 'B' : 'A'); }),
      togglePick: act(() => { ui.pick = !ui.pick; ui.more = false; ui.cam = null; }),
      toggleMore: act(() => { ui.more = !ui.more; ui.pick = false; ui.cam = null; }),
      startPlacing: act(() => { ui.placing = true; ui.more = false; }),
      openCam: act(() => { ui.cam = ui.cam === 'open' ? null : 'open'; ui.more = false; ui.pick = false; }),
      closeCam: act(() => { ui.cam = null; }),
      snap: act(() => this.snap()),
      illegal: act(() => this.rare('illegal')),
      knockedOut: act(() => this.rare('out')),
      earlyKing: act(() => this.rare('king')),
      resign: act(() => this.rare('resign'))
    };
  }
}
</script>
</body>
